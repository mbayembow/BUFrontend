<div class="card shadow border-0">
  <div class="card-header bg-success text-white text-center">
    <h4 class="mb-0">📚 Ajouter un Livre</h4>
  </div>

  <div class="card-body">
    <form (ngSubmit)="addBook()" class="row g-4">

      <div class="col-md-6">
        <label class="form-label fw-semibold">Titre</label>
        <input class="form-control"
               [(ngModel)]="newBook.titre"
               name="titre"
               required>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Référence</label>
        <input class="form-control"
               [(ngModel)]="newBook.reference"
               name="reference"
               required>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">ISBN</label>
        <input class="form-control"
               [(ngModel)]="newBook.isbn"
               name="isbn"
               required>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Statut</label>
        <select class="form-select"
                [(ngModel)]="newBook.status"
                name="status"
                required>
          <option value="">-- Choisir --</option>
          <option value="Disponible">Disponible</option>
          <option value="NonDisponible">Non disponible</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Stock</label>
        <input type="number"
               class="form-control"
               [(ngModel)]="newBook.stock"
               name="stock"
               required>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-semibold">Quantité</label>
        <input type="number"
               class="form-control"
               [(ngModel)]="newBook.quantite"
               name="quantite"
               required>
      </div>

      <div class="col-md-3">
        <label>ID Auteur</label>
        <input type="number"
               class="form-control"
               [(ngModel)]="newBook.idAuteur"
               name="idAuteur"
               required>
      </div>

      <div class="col-md-3">
        <label>ID Catégorie</label>
        <input type="number"
               class="form-control"
               [(ngModel)]="newBook.idCategorie"
               name="idCategorie"
               required>
      </div>

      <div class="col-md-3">
        <label>ID Éditeur</label>
        <input type="number"
               class="form-control"
               [(ngModel)]="newBook.idEditeur"
               name="idEditeur"
               required>
      </div>

      <div class="col-md-3">
        <label>ID Personnel</label>
        <input type="number"
               class="form-control"
               [(ngModel)]="newBook.idPersonnel"
               name="idPersonnel"
               required>
      </div>

      <div class="col-12 text-center">
        <button class="btn btn-success">
          💾 Enregistrer
        </button>
      </div>

    </form>
  </div>
</div>
