<div class="container-fluid min-vh-100">
  <div class="row min-vh-100">

    <!-- Branding -->
    <div class="col-lg-6 d-none d-lg-flex bg-primary bg-gradient
                align-items-center justify-content-center text-white">
      <div class="text-center px-5 moving-all-directions">
        <i class="bi bi-shield-lock-fill display-1 mb-4"></i>
        <h1 class="fw-bold mb-3">Bienvenue</h1>
        <p class="fs-5 opacity-75">
          Plateforme de gestion de bibliothèque
        </p>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center">
      <div class="w-100" style="max-width:650px;">

        <div class="card border-0 shadow-lg rounded-4">
          <div class="card-body p-4 p-md-5">

            <!-- Avatar -->
            <div class="text-center mb-4">
              <div class="bg-primary text-white rounded-circle d-inline-flex
                          align-items-center justify-content-center"
                   style="width:80px;height:80px;">
                <i class="bi bi-person-fill fs-1"></i>
              </div>
            </div>

            <h2 class="text-center fw-bold mb-1">Connexion</h2>
            <p class="text-center text-muted mb-4">
              Accédez à votre espace personnel
            </p>

            <form [formGroup]="connexion" (ngSubmit)="onSubmit()">

              <!-- Email -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Adresse email</label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text bg-white">
                    <i class="bi bi-envelope text-primary"></i>
                  </span>
                  <input
                    type="email"
                    class="form-control"
                    formControlName="email"
                    placeholder="exemple@email.com"
                    [class.is-invalid]="submitted && f['email'].invalid"
                  >
                </div>

                <div class="invalid-feedback" *ngIf="submitted && f['email'].errors">
                  <div *ngIf="f['email'].errors['required']">
                    L’email est obligatoire
                  </div>
                  <div *ngIf="f['email'].errors['email']">
                    Format d’email invalide
                  </div>
                </div>
              </div>

              <!-- Mot de passe -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Mot de passe</label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text bg-white">
                    <i class="bi bi-lock text-primary"></i>
                  </span>
                  <input
                    type="password"
                    class="form-control"
                    formControlName="password"
                    placeholder="••••••••"
                    [class.is-invalid]="submitted && f['password'].invalid"
                  >

                </div>
                <!---Ajout d'une pour le type de connexion --->
                <select formControlName="type">
                  <option value="USER">Utilisateur</option>
                  <option value="ADMIN">Administrateur</option>
                </select>

                <div class="invalid-feedback" *ngIf="submitted && f['password'].errors">
                  <div *ngIf="f['password'].errors['required']">
                    Mot de passe obligatoire
                  </div>
                  <div *ngIf="f['password'].errors['minlength']">
                    Minimum 6 caractères
                  </div>
                </div>
              </div>

              <!-- Options -->
              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    formControlName="remember"
                    id="remember"
                  >
                  <label class="form-check-label small" for="remember">
                    Se souvenir de moi
                  </label>
                </div>

                <a href="#" class="small text-primary text-decoration-none">
                  Mot de passe oublié ?
                </a>
              </div>

              <!-- Bouton -->
              <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Se connecter
              </button>

            </form>

            <!-- Footer -->
            <div class="text-center mt-4">
              <small class="text-muted">
                Pas encore de compte ?
                <a href="inscription"
                   class="fw-semibold text-primary text-decoration-none">
                  Créer un compte
                </a>
              </small>
            </div>

          </div>
        </div>

      </div>
    </div>

  </div>
</div>
