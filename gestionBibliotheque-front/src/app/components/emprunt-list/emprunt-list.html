<table class="table table-striped table-bordered mt-3">
  <thead class="table-dark">
  <tr>
    <th>ID</th>
    <th>Livre</th>
    <th>Utilisateur</th>
<!--    <th>Date Emprunt</th>-->
    <th>Statut</th>
    <th>Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let e of emprunts">
    <td>{{ e.idEmprunt }}</td>
    <td>{{ e.livre?.titre }}</td>
    <td>{{ e.utilisateur?.prenom }}</td>
<!--    <td>{{e.emprunt?.dateEmprunt}}</td>-->
    <td><span class="badge bg-info">{{ e.statut }}</span></td>
    <td>
      <button class="btn btn-success btn-sm me-1" (click)="valider.emit(e.idEmprunt)">Valider</button>
      <button class="btn btn-warning btn-sm me-1" (click)="refuser.emit(e.idEmprunt)">Refuser</button>
      <button class="btn btn-secondary btn-sm me-1" (click)="retourner.emit(e.idEmprunt)">Retour</button>
      <button class="btn btn-danger btn-sm" (click)="supprimer.emit(e.idEmprunt)">Supprimer</button>
    </td>
  </tr>
  </tbody>
</table>
