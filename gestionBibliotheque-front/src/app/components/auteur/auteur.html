<div class="container mt-1 ">
  <div class="row justify-content-center">
    <div class="col-md-12">

      <div class="card shadow-lg border-0">
        <div class="card-header bg-secondary-subtle text-primary text-center">
          <h4 class="mb-0">✍️ Gestion des Auteurs</h4>
        </div>

        <div class="card-body">

          <!-- ================= Formulaire ================= -->
          <form (ngSubmit)="isEditMode ? updateAuteur() : addAuteur()" class="row g-4">

            <!-- Nom -->
            <div class="col-md-4">
              <label class="form-label fw-semibold">Nom</label>
              <input
                class="form-control"
                placeholder="Nom"
                [(ngModel)]="newAuteur.nom"
                name="nom"
                required>
            </div>

            <!-- Prénom -->
            <div class="col-md-4">
              <label class="form-label fw-semibold">Prénom</label>
              <input
                class="form-control"
                placeholder="Prénom"
                [(ngModel)]="newAuteur.prenom"
                name="prenom"
                required>
            </div>

            <!-- Nationalité -->
            <div class="col-md-4">
              <label class="form-label fw-semibold">Nationalité</label>
              <input
                class="form-control"
                placeholder="Nationalité"
                [(ngModel)]="newAuteur.nationalite"
                name="nationalite"
                required>
            </div>

            <!-- Boutons -->
            <div class="col-12 d-flex justify-content-center gap-3 mt-4">
              <button
                type="submit"
                class="btn btn-outline-success px-4"
                *ngIf="!isEditMode">
                💾 Enregistrer
              </button>

              <button
                type="submit"
                class="btn btn-outline-warning px-4"
                *ngIf="isEditMode">
                ✏️ Modifier
              </button>

              <button
                type="button"
                class="btn btn-outline-danger px-4"
                (click)="resetForm()">
                ❌ Annuler
              </button>
            </div>

          </form>

          <!-- ================= Liste des auteurs ================= -->
          <hr class="my-4">

          <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Nationalité</th>
                <th class="text-center">Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let a of auteurs">
                <td>{{ a.idAuteur }}</td>
                <td>{{ a.nom }}</td>
                <td>{{ a.prenom }}</td>
                <td>{{ a.nationalite }}</td>
                <td class="text-center">
                  <button
                    class="btn btn-sm btn-warning me-2"
                    (click)="editAuteur(a)">
                    ✏️
                  </button>

                  <button
                    class="btn btn-sm btn-danger"
                    (click)="deleteAuteur(a.idAuteur)">
                    🗑️
                  </button>
                </td>
              </tr>

              <tr *ngIf="auteurs.length === 0">
                <td colspan="5" class="text-center text-muted">
                  Aucun auteur enregistré
                </td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>

    </div>
  </div>
</div>
