<div class="card mb-4 shadow container-fluid col-12 ">
  <div class="d-flex justify-content-center">
    <div class=" avatar2 bg-secondary-subtle text-center  text-primary col-12 mb-3 p-2">Créer un emprunt</div>
  </div>
    <div class="card-body">
    <form [formGroup]="empruntForm" (ngSubmit)="enregistrer()">

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">ID Utilisateur</label>
          <input type="number" class="form-control" formControlName="idUtilisateur" placeholder="ID Utilisateur">
          <div *ngIf="empruntForm.get('idUtilisateur')?.invalid && empruntForm.get('idUtilisateur')?.touched" class="text-danger small mt-1">
            L'ID utilisateur est requis et > 0
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">ID Livre</label>
          <input type="number" class="form-control" formControlName="idLivre" placeholder="ID Livre">
          <div *ngIf="empruntForm.get('idLivre')?.invalid && empruntForm.get('idLivre')?.touched" class="text-danger small mt-1">
            L'ID livre est requis et > 0
          </div>
        </div>
      </div>

      <div *ngIf="message" class="alert alert-success mt-3">{{ message }}</div>
      <div *ngIf="erreur" class="alert alert-danger mt-3">{{ erreur }}</div>

      <div class="mt-4 text-end ">
        <button class="btn btn-outline-success gp-2 me-2" type="submit">Enregistrer</button>
        <button class="btn btn-outline-danger me-2" type="reset" (click)="empruntForm.reset()">Annuler</button>
      </div>
    </form>
  </div>
</div>
