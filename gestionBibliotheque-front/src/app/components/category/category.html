<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">🗂️ Gestion des Catégories</h4>
    </div>

    <div class="card-body">

      <!-- Formulaire -->
      <form
        (ngSubmit)="isEditMode ? updateCategory() : addCategory()"
        class="row g-3 mb-4">

        <!-- Nom -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nom catégorie</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="newCategory.nom"
            name="nom"
            placeholder="Nom de la catégorie"
            required>
        </div>

        <!-- Description -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Description</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="newCategory.description"
            name="description"
            placeholder="Description de la catégorie">
        </div>

        <!-- Boutons -->
        <div class="col-12 d-flex gap-2 mt-2">
          <button class="btn btn-success px-4" type="submit">
            {{ isEditMode ? 'Modifier' : 'Ajouter' }}
          </button>

          <button
            class="btn btn-secondary px-4"
            type="button"
            (click)="resetForm()">
            Annuler
          </button>
        </div>
      </form>

      <!-- Tableau -->
      <table class="table table-bordered table-hover">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Description</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>
          @for (cat of categories; track cat.idCategorie) {
            <tr>
              <td>{{ cat.idCategorie }}</td>
              <td>{{ cat.nom }}</td>
              <td>{{ cat.description }}</td>
              <td class="text-center">
                <button
                  class="btn btn-sm btn-primary me-2"
                  (click)="editCategory(cat)">
                  Modifier
                </button>
                <button
                  class="btn btn-sm btn-danger"
                  (click)="deleteCategory(cat.idCategorie)">
                  Supprimer
                </button>
              </td>
            </tr>
          }

          @if (categories?.length === 0) {
            <tr>
              <td colspan="4" class="text-center text-muted">
                Aucune catégorie enregistrée
              </td>
            </tr>
          }
        </tbody>
      </table>

    </div>
  </div>
</div>
