<div class="container my-3">
  <h5 class="mb-3">Mes emprunts</h5>

  <div *ngIf="empruntsFiltres.length === 0" class="text-center text-muted">
    Aucun emprunt trouvé pour ce filtre.
  </div>

  <div class="row g-3">
    <div class="col-12" *ngFor="let e of empruntsFiltres">
      <div class="card p-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <strong>{{ e.livre?.titre }}</strong> par {{ e.livre?.auteur }}
            <div class="small text-muted">Emprunté le : {{ e.dateEmprunt | date:'shortDate' }}</div>
            <div class="small text-muted">Retour prévu : {{ e.dateRetour | date:'shortDate' }}</div>
          </div>
          <div [ngClass]="getClass(e.statut)">
            {{ getLabel(e.statut) }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
